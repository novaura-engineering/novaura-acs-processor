name: Deploy to ECS

# This workflow builds and pushes the image only. Terraform is applied manually from a
# developer machine via ./terraform-plan.sh and ./terraform-apply.sh, which resolve the
# image tag from the current commit and refuse to run when no such tag exists in ECR.
#
# After merging, pull main before applying so the local commit matches the tag this
# workflow pushed for the merge commit.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Queue rather than cancel. A newer push cancelling an in-flight build is how a merged
# commit ended up with no image in ECR, which then broke a local apply that named its tag.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: novaura-acs-processor
  ECS_CLUSTER: novaura-acs-processor-cluster
  # ECS services (from terraform/ecs.tf)
  ECS_SERVICE_BULK_SCHEDULER: novaura-acs-bulk-campaign-scheduler
  ECS_SERVICE_JOURNEY_SCHEDULER: novaura-acs-journey-scheduler
  ECS_SERVICE_BULK_WORKER: novaura-acs-bulk-campaign-worker
  ECS_SERVICE_JOURNEY_WORKER: novaura-acs-journey-worker
  ECS_SERVICE_COMMUNICATION_WORKER: novaura-acs-communication-processor-worker-service
  ECS_SERVICE_SMS_MARKETING_WORKER: novaura-acs-sms-marketing-worker-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        run: |
          python -m pytest

  build-and-push:
    name: Build and Push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
